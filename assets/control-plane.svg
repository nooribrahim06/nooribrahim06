<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img">
  <title>Nour Ibrahim — Systems Control Plane</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b12"/><stop offset="1" stop-color="#0d1624"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#62e6a7"/><stop offset="1" stop-color="#53b7ff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8aa0b8" stroke-opacity=".055"/></pattern>
    <style>
      text{font-family:'JetBrains Mono','Cascadia Code',Consolas,monospace} .muted{fill:#7e91a8}.white{fill:#e7eef7}.green{fill:#62e6a7}.blue{fill:#53b7ff}
      .packet{animation:flow 4s linear infinite}.packet:nth-of-type(2){animation-delay:-1.35s}.packet:nth-of-type(3){animation-delay:-2.7s}
      @keyframes flow{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(515px);opacity:0}}
      .blink{animation:blink 1.1s steps(2,end) infinite}@keyframes blink{50%{opacity:0}}
      @media(prefers-reduced-motion:reduce){.packet,.blink{animation:none}}
      @media(prefers-color-scheme:light){.frame{stroke:#253650}.muted{fill:#a4b3c4}}
    </style>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="#203047" class="frame"/>
  <circle cx="34" cy="30" r="5" fill="#ff6b6b"/><circle cx="52" cy="30" r="5" fill="#ffd166"/><circle cx="70" cy="30" r="5" fill="#62e6a7"/>
  <text x="92" y="35" font-size="13" class="muted">nour@control-plane:~</text>
  <text x="54" y="112" font-size="15" class="green">$ whoami --verbose</text>
  <text x="54" y="178" font-size="52" font-weight="700" letter-spacing="-2" class="white">NOUR IBRAHIM</text>
  <text x="57" y="215" font-size="17" class="muted">COMPUTER ENGINEERING · CAIRO UNIVERSITY</text>
  <text x="57" y="258" font-size="20" class="blue">backend systems</text><text x="242" y="258" font-size="20" class="muted">×</text><text x="270" y="258" font-size="20" class="green">machine intelligence</text>
  <text x="57" y="330" font-size="14" class="muted">intent</text><text x="142" y="330" font-size="14" class="white">build systems that stay correct under pressure</text>
  <text x="57" y="362" font-size="14" class="muted">state</text><text x="142" y="362" font-size="14" class="green">LEARNING / SHIPPING / ITERATING</text><rect x="433" y="348" width="9" height="17" rx="1" fill="#62e6a7" class="blink"/>
  <g transform="translate(770 98)">
    <rect width="360" height="230" rx="16" fill="#0b121d" stroke="#263850"/>
    <text x="24" y="37" font-size="12" class="muted">REQUEST TRACE  /  LIVE</text>
    <path d="M35 116H325" stroke="#263850" stroke-width="2"/>
    <circle cx="42" cy="116" r="10" fill="#101d2a" stroke="#53b7ff"/><circle cx="180" cy="116" r="10" fill="#101d2a" stroke="#62e6a7"/><circle cx="318" cy="116" r="10" fill="#101d2a" stroke="#53b7ff"/>
    <text x="24" y="151" font-size="11" class="blue">CLIENT</text><text x="151" y="151" font-size="11" class="green">SERVICE</text><text x="294" y="151" font-size="11" class="blue">DATA</text>
    <g filter="url(#glow)"><circle class="packet" cx="42" cy="116" r="4" fill="#62e6a7"/><circle class="packet" cx="42" cy="116" r="4" fill="#53b7ff"/><circle class="packet" cx="42" cy="116" r="4" fill="#62e6a7"/></g>
    <text x="24" y="196" font-size="12" class="muted">p95</text><text x="72" y="196" font-size="12" class="white">thinking deeply</text><text x="252" y="196" font-size="12" class="green">● healthy</text>
  </g>
</svg>
