name: Operate production incident

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: incident-simulator
  cancel-in-progress: false

jobs:
  respond:
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[INCIDENT] response: ') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Evaluate operator response
        id: engine
        env:
          INCIDENT_COMMAND: ${{ github.event_name == 'issues' && github.event.issue.title || '' }}
          INCIDENT_OPERATOR: ${{ github.event.issue.user.login || 'system' }}
        run: |
          result=$(python scripts/incident_engine.py)
          echo "result=$result" >> "$GITHUB_OUTPUT"
      - name: Commit new incident state
        run: |
          git config user.name "incident-control[bot]"
          git config user.email "incident-control[bot]@users.noreply.github.com"
          git add state/incident.json assets/incident.svg
          git diff --cached --quiet || git commit -m "ops: apply incident response by @${{ github.actor }}"
          git push
      - name: Report and close incident command
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ steps.engine.outputs.result }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "### Control plane response

          **$RESULT**

          The next incident has been deployed to the [profile](https://github.com/${{ github.repository_owner }})."
          gh issue close "${{ github.event.issue.number }}" --reason completed
